name: Verificar site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vitoria-santa-production
          path: dist/
          include-hidden-files: false
